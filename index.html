<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="phar.css">
</head>

<body>

  <nav id="mainNavbar" class="navbar navbar-dark navbar-expand-md py-0 fixed-top">
    <a class="navbar-brand" href="#">💊 PharmaKalCare</a>
    <button class="navbar-toggler bg-outline-success" data-toggle="collapse" data-target="#navLinks">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navLinks">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="#">HOME</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">INVENTORY</a>
        </li>

          <a class="nav-link" href="#">CONTACT</a>
        </li>
      </ul>
    </div>

  <!-- --- HERO SECTION --- -->

  <header class="hero">
    <h1>Pharmacy Stock Management System</h1>
    <p>
      Manage inventory, track medicine sales,
      and monitor expiry alerts easily.
    </p>
  </header>



  <!-- --- MAIN CONTENT --- -->

  <main class="container">

    <!-- ADD MEDICINE -->
    <section class="card">

      <h2>Add Medicine</h2>

      <input type="text" id="name" placeholder="Medicine Name">

      <input type="number" id="quantity" placeholder="Quantity">

      <input type="date" id="expiry">

      <input type="number" id="price" placeholder="Price">

      <button class="btn btn-outline-success" onclick="addMedicine()">
        Add Medicine
      </button>

    </section>



    <!-- SELL MEDICINE -->
    <section class="card">

      <h2>Sell Medicine</h2>

      <input type="text" id="sellName" placeholder="Medicine Name">

      <input type="number" id="sellQty" placeholder="Quantity">

      <button class="btn btn-outline-warning" onclick="sellMedicine()">
        Sell Medicine
      </button>

    </section>



    <!-- ACTIONS -->
    <section class="card action-card">

      <h2>Quick Actions</h2>

      <button class="btn btn-outline-primary" onclick="listInventory()">
        View Inventory
      </button>

      <button class="btn btn-outline-danger" onclick="listExpiringSoon()">
        Expiry Alerts
      </button>

      <button class="btn btn-outline-info" onclick="dailyReport()">
        Daily Report
      </button>

    </section>



    <!-- OUTPUT -->
    <section class="output-card">

      <div id="output">

        Welcome to PharmaKalCare 💊

      </div>

    </section>

  </main>



  <!-- ================= FOOTER ================= -->

  <footer class="footer">

    <p>
      © 2026 PharmaKalCare System |
      By FrankKal Tech
    </p>

  </footer>

    crossorigin="anonymous"></script>

  <script>
    $(function () {
      $(document).scroll(function () {
        var $nav = $("#mainNavbar");
        $nav.toggleClass("scrolled", $(this).scrollTop() > $nav.height());
      });
    });
  </script>

  <script src="phar.js"></script>
